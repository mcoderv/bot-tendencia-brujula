services:
  - type: web
    name: bot-tendencia-brujula
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TZ_NAME
        value: America/Caracas
      - key: HL_REST_URL
        value: https://api.hyperliquid.xyz/info
      - key: ASSETS
        value: BTC,ETH,SOL